<style>
  :root{
    --navy:#0d2b2e;
    --navy-2:#123a3e;
    --teal:#0e8074;
    --teal-light:#e3f3ef;
    --mint:#5fd9b8;
    --coral:#e8744f;
    --coral-light:#fdebe2;
    --paper:#f7f5f0;
    --ink:#13201f;
    --muted:#647571;
    --line:#dde6e2;
    --white:#ffffff;
    --red:#c0392b;
    --red-light:#fbeae8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  #root{min-height:100vh;}
  button{font-family:inherit;}
  a{color:var(--teal);text-decoration:none;}

  /* ===== Auth screens ===== */
  .auth-shell{
    min-height:100vh;
    display:flex;
    background:var(--navy);
  }
  .auth-art{
    flex:1.1;
    background:radial-gradient(circle at 30% 20%, #16484a 0%, var(--navy) 60%);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:60px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .auth-art .toothmark{
    position:absolute;
    right:-60px;
    bottom:-60px;
    opacity:0.08;
  }
  .auth-art .brandmark{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:50px;
  }
  .auth-art .brandmark .logo-img{width:38px;height:38px;border-radius:10px;object-fit:cover;}
  .auth-art .brandmark .mark{
    width:38px;height:38px;background:var(--mint);border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;color:var(--navy);font-size:16px;
  }
  .auth-art .brandmark .name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
  .auth-art h1{font-size:38px;line-height:1.15;max-width:420px;color:#fff;}
  .auth-art .sub{font-size:14.5px;opacity:0.65;margin-top:16px;max-width:380px;line-height:1.6;}
  .auth-art .stat-row{display:flex;gap:32px;margin-top:48px;}
  .auth-art .stat{}
  .auth-art .stat .n{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--mint);}
  .auth-art .stat .l{font-size:11.5px;opacity:0.55;margin-top:3px;}

  .auth-panel{
    width:460px;
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
  }
  .auth-card{
    width:100%;
    max-width:360px;
  }
  .auth-card .eyebrow{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:8px;}
  .auth-card h2{font-size:24px;margin-bottom:6px;}
  .auth-card .sub{font-size:13px;color:var(--muted);margin-bottom:26px;}

  label{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px;color:var(--ink);}
  input,select,textarea{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;
    font-size:13.5px;font-family:inherit;margin-bottom:16px;background:#fff;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  input::placeholder{color:#a8b5b1;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 18px;border-radius:9px;border:none;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:transform .08s, box-shadow .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:#0a6b61;}
  .btn-primary:disabled{background:#9bc4be;cursor:not-allowed;}
  .btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--teal);color:var(--teal);}
  .btn-coral{background:var(--coral);color:#fff;}
  .btn-coral:hover{background:#d35f3a;}
  .btn-danger{background:transparent;color:var(--red);}
  .btn-danger:hover{background:var(--red-light);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 13px;font-size:12.5px;}

  .role-toggle{
    display:flex;
    background:var(--teal-light);
    border-radius:10px;
    padding:4px;
    margin-bottom:22px;
  }
  .role-toggle button{
    flex:1;background:transparent;border:none;padding:9px;border-radius:7px;
    font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;
  }
  .role-toggle button.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,0.08);}

  .error-box{
    background:var(--red-light);color:var(--red);font-size:12.5px;
    padding:10px 13px;border-radius:8px;margin-bottom:14px;
  }
  .info-box{
    background:#fff8ec;border:1px solid #f3e2bd;color:#8a6116;font-size:12.5px;
    padding:11px 14px;border-radius:8px;margin-bottom:16px;
  }
  .success-box{
    background:#e7f6ec;color:#1e8e4e;font-size:12.5px;
    padding:10px 13px;border-radius:8px;margin-bottom:14px;
  }

  .center-card{
    max-width:440px;margin:60px auto;text-align:center;
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:42px 34px;
  }
  .center-card .ic{font-size:46px;margin-bottom:14px;}

  .spinner{
    width:18px;height:18px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.4);border-top-color:#fff;
    animation:spin 0.7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .loading-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--navy);color:#fff;flex-direction:column;gap:14px;
  }
  .loading-screen .dot-spin{
    width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(255,255,255,0.2);border-top-color:var(--mint);
    animation:spin 0.8s linear infinite;
  }

  @media (max-width:880px){
    .auth-art{display:none;}
    .auth-panel{width:100%;}
  }
</style>
