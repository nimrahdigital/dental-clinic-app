<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DentalCare — Clinic Management</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Supabase: browser-ready build, with automatic fallback to a second CDN -->

  if (typeof window.supabase === 'undefined') {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');
  }
</script>

<style>
  :root{
    --navy:#0d2b2e;
    --navy-2:#123a3e;
    --teal:#0e8074;
    --teal-light:#e3f3ef;
    --mint:#5fd9b8;
    --coral:#e8744f;
    --coral-light:#fdebe2;
    --paper:#f7f5f0;
    --ink:#13201f;
    --muted:#647571;
    --line:#dde6e2;
    --white:#ffffff;
    --red:#c0392b;
    --red-light:#fbeae8;

    /* Admin dashboard palette */
    --purple:#7C3AED;
    --purple-dark:#5B21B6;
    --purple-light:#EDE9FE;
    --admin-blue:#185FA5;
    --admin-blue-dark:#0C447C;
    --admin-blue-light:#E6F1FB;
    --admin-green:#0F6E56;
    --admin-green-light:#E1F5EE;
    --admin-amber:#633806;
    --admin-amber-light:#FAEEDA;
    --admin-red:#A32D2D;
    --admin-red-light:#FEE2E2;

    /* Theme-aware surface tokens (light defaults) */
    --surf-bg:#F1F5F9;
    --surf-card:#FFFFFF;
    --surf-border:#E2E8F0;
    --surf-text:#1A2233;
    --surf-muted:#64748B;
    --surf-light:#94A3B8;
    --surf-sidebar:#FFFFFF;
    --surf-shadow:0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
    --surf-hover:#FAFBFF;
  }
  [data-theme="dark"]{
    --surf-bg:#0f1115;
    --surf-card:#1a1d24;
    --surf-border:#2a2e38;
    --surf-text:#e8eaf0;
    --surf-muted:#9aa1b0;
    --surf-light:#6b7280;
    --surf-sidebar:#15171d;
    --surf-shadow:0 1px 3px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
    --surf-hover:#22252e;
    --purple-light:#2d2147;
    --admin-blue-light:#162536;
    --admin-green-light:#102923;
    --admin-amber-light:#2e2210;
    --admin-red-light:#341818;
    --paper:#0f1115;
    --line:#2a2e38;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  #root{min-height:100vh;}
  button{font-family:inherit;}
  a{color:var(--teal);text-decoration:none;}

  /* ===== Auth screens ===== */
  .auth-shell{
    min-height:100vh;
    display:flex;
    background:var(--navy);
  }
  .auth-art{
    flex:1.1;
    background:radial-gradient(circle at 30% 20%, #16484a 0%, var(--navy) 60%);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:60px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .auth-art .toothmark{
    position:absolute;
    right:-60px;
    bottom:-60px;
    opacity:0.08;
  }
  .auth-art .brandmark{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:50px;
  }
  .auth-art .brandmark .logo-img{width:38px;height:38px;border-radius:10px;object-fit:cover;}
  .auth-art .brandmark .mark{
    width:38px;height:38px;background:var(--mint);border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;color:var(--navy);font-size:16px;
  }
  .auth-art .brandmark .name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
  .auth-art h1{font-size:38px;line-height:1.15;max-width:420px;color:#fff;}
  .auth-art .sub{font-size:14.5px;opacity:0.65;margin-top:16px;max-width:380px;line-height:1.6;}
  .auth-art .stat-row{display:flex;gap:32px;margin-top:48px;}
  .auth-art .stat{}
  .auth-art .stat .n{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--mint);}
  .auth-art .stat .l{font-size:11.5px;opacity:0.55;margin-top:3px;}

  .auth-panel{
    width:460px;
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
  }
  .auth-card{
    width:100%;
    max-width:360px;
  }
  .auth-card .eyebrow{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:8px;}
  .auth-card h2{font-size:24px;margin-bottom:6px;}
  .auth-card .sub{font-size:13px;color:var(--muted);margin-bottom:26px;}

  label{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px;color:var(--ink);}
  input,select,textarea{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;
    font-size:13.5px;font-family:inherit;margin-bottom:16px;background:#fff;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  input::placeholder{color:#a8b5b1;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 18px;border-radius:9px;border:none;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:transform .08s, box-shadow .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:#0a6b61;}
  .btn-primary:disabled{background:#9bc4be;cursor:not-allowed;}
  .btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--teal);color:var(--teal);}
  .btn-coral{background:var(--coral);color:#fff;}
  .btn-coral:hover{background:#d35f3a;}
  .btn-danger{background:transparent;color:var(--red);}
  .btn-danger:hover{background:var(--red-light);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 13px;font-size:12.5px;}

  .role-toggle{
    display:flex;
    background:var(--teal-light);
    border-radius:10px;
    padding:4px;
    margin-bottom:22px;
  }
  .role-toggle button{
    flex:1;background:transparent;border:none;padding:9px;border-radius:7px;
    font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;
  }
  .role-toggle button.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,0.08);}

  .error-box{
    background:var(--red-light);color:var(--red);font-size:12.5px;
    padding:10px 13px;border-radius:8px;margin-bottom:14px;
  }
  .info-box{
    background:#fff8ec;border:1px solid #f3e2bd;color:#8a6116;font-size:12.5px;
    padding:11px 14px;border-radius:8px;margin-bottom:16px;
  }
  .success-box{
    background:#e7f6ec;color:#1e8e4e;font-size:12.5px;
    padding:10px 13px;border-radius:8px;margin-bottom:14px;
  }

  .center-card{
    max-width:440px;margin:60px auto;text-align:center;
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:42px 34px;
  }
  .center-card .ic{font-size:46px;margin-bottom:14px;}

  .spinner{
    width:18px;height:18px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.4);border-top-color:#fff;
    animation:spin 0.7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .loading-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--navy);color:#fff;flex-direction:column;gap:14px;
  }
  .loading-screen .dot-spin{
    width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(255,255,255,0.2);border-top-color:var(--mint);
    animation:spin 0.8s linear infinite;
  }

  @media (max-width:880px){
    .auth-art{display:none;}
    .auth-panel{width:100%;}
  }
  /* ============================================
     ADMIN DASHBOARD — full reference match, theme-aware
     ============================================ */
  .admin-root{ color:var(--surf-text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }
  .a-topbar{
    background:var(--surf-card); border-bottom:1px solid var(--surf-border);
    padding:0 24px; height:56px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:100; flex-shrink:0; box-shadow:0 1px 4px rgba(0,0,0,.05);
  }
  .a-topbar-left{ display:flex; align-items:center; gap:20px; }
  .a-logo{ font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px; color:var(--surf-text); }
  .a-logo-badge{ background:var(--purple); color:#fff; font-size:9px; font-weight:700; padding:3px 8px; border-radius:20px; letter-spacing:.06em; }
  .a-nav-links{ display:flex; gap:2px; }
  .a-nav-link{
    font-size:13px; padding:6px 12px; border-radius:8px; color:var(--surf-muted); cursor:pointer;
    border:none; background:transparent; font-weight:500; transition:all .15s; font-family:inherit;
  }
  .a-nav-link:hover{ background:var(--surf-bg); color:var(--surf-text); }
  .a-nav-link.active{ background:var(--purple-light); color:var(--purple-dark); }
  .a-topbar-right{ display:flex; align-items:center; gap:10px; }
  .a-icon-btn{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--surf-border); background:var(--surf-bg);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--surf-muted); font-size:14px;
    position:relative; transition:all .15s;
  }
  .a-icon-btn:hover{ background:var(--surf-border); color:var(--surf-text); }
  .a-notif-dot{ position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--admin-red); border:1.5px solid var(--surf-card); }
  .a-avatar-admin{ cursor:pointer; }

  .a-sidebar{
    width:220px; background:var(--surf-sidebar); border-right:1px solid var(--surf-border);
    padding:16px 12px; display:flex; flex-direction:column; gap:2px; flex-shrink:0;
    position:sticky; top:56px; height:calc(100vh - 56px); overflow-y:auto;
  }
  .a-s-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px;
    font-size:13px; color:var(--surf-muted); cursor:pointer; border:none; background:transparent;
    width:100%; text-align:left; transition:all .15s; font-weight:500; font-family:inherit;
  }
  .a-s-item i{ font-size:16px; width:18px; text-align:center; }
  .a-s-item:hover{ background:var(--surf-bg); color:var(--surf-text); }
  .a-s-item.active{ background:var(--purple-light); color:var(--purple-dark); }
  .a-s-item.danger{ color:var(--admin-red); }
  .a-s-item.danger:hover{ background:var(--admin-red-light); }
  .a-s-badge{ margin-left:auto; background:var(--admin-red); color:#fff; font-size:10px; font-weight:700; padding:1px 7px; border-radius:20px; }
  .a-s-div{ height:1px; background:var(--surf-border); margin:8px 0; }

  .a-content{ flex:1; padding:24px; display:flex; flex-direction:column; gap:18px; overflow-y:auto; }

  .a-page-header{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .a-page-title{ font-size:20px; font-weight:700; color:var(--surf-text); }
  .a-page-sub{ font-size:13px; color:var(--surf-muted); margin-top:3px; }
  .a-btn-primary{
    display:inline-flex; align-items:center; gap:8px; padding:10px 18px; background:var(--purple); color:#fff;
    border:none; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; transition:background .15s;
    font-family:inherit;
  }
  .a-btn-primary:hover{ background:var(--purple-dark); }
  .a-btn-primary:disabled{ opacity:0.6; cursor:not-allowed; }
  .a-btn-outline{
    padding:9px 14px; background:var(--surf-bg); border:1px solid var(--surf-border); border-radius:9px;
    font-size:12.5px; font-weight:600; color:var(--surf-text); cursor:pointer; font-family:inherit;
  }
  .a-btn-outline:hover{ background:var(--surf-hover); }
  .a-btn-danger-outline{
    padding:8px 14px; background:transparent; border:1px solid var(--admin-red-light); border-radius:9px;
    font-size:12.5px; font-weight:600; color:var(--admin-red); cursor:pointer; font-family:inherit;
  }
  .a-btn-danger-outline:hover{ background:var(--admin-red-light); }

  .a-stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .a-stat-card{
    background:var(--surf-card); border:1px solid var(--surf-border); border-radius:12px; padding:16px 18px;
    box-shadow:var(--surf-shadow); position:relative; overflow:hidden;
  }
  .a-stat-icon{ width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:12px; }
  .a-stat-val{ font-size:26px; font-weight:700; color:var(--surf-text); line-height:1; font-family:'IBM Plex Mono',monospace; }
  .a-stat-label{ font-size:11px; color:var(--surf-muted); font-weight:500; text-transform:uppercase; letter-spacing:.05em; margin-top:5px; }
  .a-stat-delta{ font-size:11px; font-weight:600; margin-top:8px; display:flex; align-items:center; gap:4px; color:var(--admin-green); }
  .a-stat-delta.warn{ color:var(--admin-amber); }
  .a-stat-accent{ position:absolute; bottom:0; left:0; right:0; height:3px; }

  .a-panel{ background:var(--surf-card); border:1px solid var(--surf-border); border-radius:12px; padding:18px 20px; box-shadow:var(--surf-shadow); }
  .a-panel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .a-panel-title{ font-size:14px; font-weight:600; color:var(--surf-text); }
  .a-panel-action{ font-size:12px; color:var(--purple); cursor:pointer; font-weight:500; }
  .a-panel-action:hover{ text-decoration:underline; }

  .a-grid-2{ display:grid; grid-template-columns:1fr 320px; gap:14px; }
  .a-grid-2-equal{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:1100px){ .a-grid-2{ grid-template-columns:1fr; } .a-grid-2-equal{ grid-template-columns:1fr; } .a-stat-row{ grid-template-columns:repeat(2,1fr); } }

  .a-qa-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .a-qa-btn{
    display:flex; align-items:center; gap:9px; padding:11px 12px; border-radius:10px;
    border:1px solid var(--surf-border); background:var(--surf-bg); cursor:pointer; font-size:12.5px;
    font-weight:500; color:var(--surf-text); transition:all .15s; font-family:inherit;
  }
  .a-qa-btn i{ font-size:17px; color:var(--purple); }
  .a-qa-btn:hover{ background:var(--purple-light); border-color:#C4B5FD; color:var(--purple-dark); }

  .a-doc-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--surf-border); }
  .a-doc-row:last-child{ border-bottom:none; }
  .a-doc-info{ flex:1; min-width:0; }
  .a-doc-nm{ font-size:13px; font-weight:600; color:var(--surf-text); }
  .a-doc-sp{ font-size:11px; color:var(--surf-light); margin-top:2px; }
  .a-doc-appt{ font-size:12px; font-weight:600; color:var(--purple); }
  .a-online-dot{ width:8px; height:8px; border-radius:50%; background:#22C55E; display:inline-block; margin-right:5px; }

  .a-action-icon{
    width:28px; height:28px; border-radius:7px; border:1px solid var(--surf-border); background:var(--surf-bg);
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--surf-muted);
    font-size:13px; transition:all .15s; margin-right:4px;
  }
  .a-action-icon:hover{ background:var(--purple-light); color:var(--purple); border-color:#C4B5FD; }
  .a-action-icon.danger:hover{ background:var(--admin-red-light); color:var(--admin-red); border-color:#f3c6c2; }

  .a-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .a-table thead th{ text-align:left; color:var(--surf-light); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:0 12px 12px; }
  .a-table tbody td{ padding:11px 12px; border-top:1px solid var(--surf-border); color:var(--surf-text); vertical-align:middle; }
  .a-table tbody tr:hover td{ background:var(--surf-hover); }
  .a-td-sub{ font-size:11px; color:var(--surf-light); margin-top:2px; }

  .a-pill{ display:inline-block; font-size:10px; padding:3px 10px; border-radius:20px; font-weight:600; }
  .a-pill.pill-green{ background:var(--admin-green-light); color:var(--admin-green); }
  .a-pill.pill-blue{ background:var(--admin-blue-light); color:var(--admin-blue-dark); }
  .a-pill.pill-amber{ background:var(--admin-amber-light); color:var(--admin-amber); }
  .a-pill.pill-red{ background:var(--admin-red-light); color:var(--admin-red); }
  .a-pill.pill-purple{ background:var(--purple-light); color:var(--purple-dark); }
  .a-pill.pill-gray{ background:var(--surf-bg); color:var(--surf-muted); }

  .a-mini-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .a-mini-stat{ background:var(--surf-bg); border-radius:9px; padding:10px 12px; text-align:center; }
  .a-mini-stat-val{ font-size:18px; font-weight:700; color:var(--surf-text); font-family:'IBM Plex Mono',monospace; }
  .a-mini-stat-label{ font-size:10px; color:var(--surf-muted); margin-top:2px; text-transform:uppercase; letter-spacing:.04em; }

  .a-chart-bars{ display:flex; align-items:flex-end; gap:6px; height:100px; margin-bottom:6px; }
  .a-bar-col{ display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; }
  .a-bar{ width:100%; border-radius:6px 6px 0 0; cursor:pointer; transition:opacity .15s; min-height:3px; }
  .a-bar:hover{ opacity:.75; }
  .a-bar-lbl{ font-size:10px; color:var(--surf-light); font-weight:500; }
  .a-bar-lbl.current{ color:var(--purple); font-weight:700; }
  .a-chart-meta{ display:flex; justify-content:space-between; font-size:11px; color:var(--surf-light); margin-top:10px; padding-top:10px; border-top:1px solid var(--surf-border); flex-wrap:wrap; gap:6px; }
  .a-chart-highlight{ color:var(--purple); font-weight:600; }

  .a-alert-item{ display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--surf-border); }
  .a-alert-item:last-child{ border-bottom:none; }
  .a-alert-dot{ width:9px; height:9px; border-radius:50%; margin-top:5px; flex-shrink:0; }
  .a-alert-text{ font-size:13px; color:var(--surf-text); line-height:1.5; }
  .a-alert-time{ font-size:11px; color:var(--surf-light); margin-top:3px; }

  .a-role-toggle{ display:flex; background:var(--surf-bg); border-radius:10px; padding:4px; margin-bottom:18px; }
  .a-role-toggle button{ flex:1; background:transparent; border:none; padding:9px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--surf-muted); cursor:pointer; font-family:inherit; }
  .a-role-toggle button.active{ background:var(--surf-card); color:var(--surf-text); box-shadow:0 1px 4px rgba(0,0,0,0.08); }

  .a-label{ font-size:12.5px; font-weight:600; display:block; margin-bottom:6px; color:var(--surf-text); }
  .a-input{
    width:100%; padding:11px 13px; border:1.5px solid var(--surf-border); border-radius:9px; font-size:13.5px;
    font-family:inherit; margin-bottom:14px; background:var(--surf-card); color:var(--surf-text);
  }
